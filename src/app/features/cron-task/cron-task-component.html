<p-confirmdialog />
<div class="flex justify-center items-center">

    @for (task of this.tasks(); track $index) {
        <p-card 
            [header]="task.name"
            class="w-10/12 mt-5"
            >
            <ng-template #content>
                <div>
                    {{task.description}}
                </div>
                <div>
                    <span>Current Status: {{task.active ? 'Active' : 'Deactive'}}</span>
                </div>
            </ng-template>
            <ng-template #footer styleClass="flex justify-end items-end">
                <p-button (click)="this.onToggleButtonChange(task.id, !task.active)" [label]="task.active ? 'Disable' : 'Enable'" [icon]="task.active ? 'pi pi-power-off' : 'pi pi-play-circle'" />
                <!-- <p-toggleButton onLabel="Active" offLabel="Deactive" styleClass="w-24" (onChange)=""  /> -->
            </ng-template>
        </p-card>
    }

</div>
