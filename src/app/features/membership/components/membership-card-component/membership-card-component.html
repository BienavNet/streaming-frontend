<p-card header="Details" class="w-80 mb-2">
    <div class="gap-1 flex flex-row justify-between">
        <div class="flex-col ml-5">
            <span class="block"><b>Plan:</b> {{this.membership().details.plan}}</span>
            <span class="block"><b>Profiles Quantity:</b> {{this.membership().details.profiles}}</span>
            <span class="block"><b>Free Trial:</b> {{this.membership().isFreeTrial ? "yes" : "no"}}</span>
            <span class="block"><b>Buy At:</b> {{this.membership().membershipBuyDate}}</span>
            <span class="block"><b>Ends At:</b> {{this.membership().membershipExpireDate}}</span>
        </div>
        <div class="flex-col gap-20">
            <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap my-2" label="Update"
                icon="pi pi-id-card" severity="info" />
            <!-- <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap" label="Delete"
                icon="pi pi-id-card" severity="danger" /> -->
        </div>
    </div>
</p-card>
