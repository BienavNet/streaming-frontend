<p-panel>
    <!-- <p-dialog [closable]="true" [closeOnEscape]="true" [modal]="true" [visible]="true" [draggable]="false" styleClass="w-2xl h-96 p-5" (onHide)="this.closeModal()"> -->
    <p-dialog [draggable]="false" [modal]="true" [visible]="true" styleClass="w-xl" [closable]="true"
        [blockScroll]="true" [autofocus]="true" [contentStyle]="{'overflow': 'visible'}" styleClass="w-xl"
        [closeOnEscape]="true" (onHide)="this.closeModal()">
        <ng-template #header>
            <div class="w-full flex flex-col justify-between items-start px-2 gap-1 ">
                <div class="w-full flex flex-row justify-start items-center gap-5">
                    <span class="font-bold text-2xl">Membership</span>
                    @if (!this.membershipDetails()) {
                    <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap self-end"
                        [label]="this.isRegisterFormActive() ? 'Cancel' : 'Add Membership'"
                        [icon]="this.isRegisterFormActive() ? 'pi pi-times-circle' : 'pi pi-plus'" severity="secondary"
                        (click)="this.onClickRegisterBtn()" />
                    } @else {
                    <div class="flex-col gap-20">
                        <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap self-end"
                            [label]="this.isUpdateBtnPressed() ? 'Go Back' : 'Update Membership'" severity="secondary"
                            [icon]="this.isUpdateBtnPressed() ? 'pi pi-arrow-circle-left' : 'pi pi-user-edit'"
                            (click)="this.onUpdateClickBtn()" />
                    </div>
                    }

                </div>
                <div>
                    <span class="text-sm italic">You are viewing an managing all about memberships.</span>
                </div>



            </div>
        </ng-template>


        @if (!this.membershipDetails()) {
        @if (this.isRegisterFormActive()) {
        <app-register-membership-form-component />
        } @else {
        <span>No membership has been registered for this account.</span>
        }

        } @else {

        @if (this.isUpdateBtnPressed()) {
        <app-update-membership-component [membershipToUpdate]="this.membershipDetails()!"
            (onClose)="this.onUpdateClickBtn()" />
        } @else {
        <div class="w-full flex justify-center">
            <app-membership-card-component [membership]="this.membershipDetails()!" />
        </div>
        }


        }


    </p-dialog>
</p-panel>
