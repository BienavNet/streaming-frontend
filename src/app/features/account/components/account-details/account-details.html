<p-dialog header="Account Details" [draggable]="false" [modal]="true" [visible]="true" styleClass="w-xl"
    [closable]="true" [blockScroll]="true" [autofocus]="true" [contentStyle]="{'overflow': 'visible'}"
    (onHide)="this.onCloseModal.emit()">

    <ng-template #header>
        <div>
            <div class="w-full flex flex-row justify-start items-center gap-5 pl-5">
                <span class="font-bold text-2xl">Account Details</span>
                <div class="card flex justify-center">
                    <!-- <p-togglebutton onLabel="Editing" offLabel="Edit" offIcon="pi pi-pencil" [onIcon]="'pi pi-file-edit'" class="w-30" ariaLabel="Edit account" size="small" [(ngModule)]="this.isEditingButton" /> -->
                    <p-togglebutton [(ngModel)]="isEditingButton" onLabel="Cancel" offLabel="Edit" offIcon="pi pi-file-edit"
                        [onIcon]="'pi pi-times-circle'" class="w-30" ariaLabel="Edit account" size="small"
                        (onChange)="this.onChangeIsEditingButton()" />
                </div>
            </div>
            <div>
                <span class="text-sm italic pl-5">You are looking and you can updating all about account details.</span>
            </div>
        </div>
    </ng-template>

    <div class="card mx-10 my-3">
        <span class="block mb-1 font-semibold">Details</span>
        <div class="card gap-2 w-full flex flex-row items-center justify-between">
            <p-iftalabel class="w-11/12 self-start">
                <input pInputText id="email" [formField]="this.editForm.email" autocomplete="off" class="w-full mb-1" />
                <label for="email">Email</label>
            </p-iftalabel>
            <p-button size="large" variant="outlined"><i class="pi pi-clone" pButtonIcon
                    (click)="this.copyText(this.account()?.email)"></i></p-button>
        </div>
        <div class="card gap-2 w-full flex flex-row items-center justify-between">
            <p-iftalabel class="w-11/12 self-start">
                <input pInputText id="password" [formField]="this.editForm.password" autocomplete="off"
                    class="w-full mb-1" />
                <label for="password">Password</label>
            </p-iftalabel>
            <p-button size="large" variant="outlined"><i class="pi pi-clone" pButtonIcon
                    (click)="this.copyText(this.account()?.password)"></i></p-button>
        </div>
        <p-iftalabel>
            <input pInputText id="registeredAt" [value]="this.account()?.registeredAt | date" autocomplete="off" disabled
                class="w-full mb-1" />
            <label for="registeredAt">Registered At</label>
        </p-iftalabel>

    </div>

    <!-- Mejorar la UI de las entidades-->

    @if (!isEditingButton()) {
    <div class="card gap-3 mx-10 my-3">
        <span class="block mb-1 font-semibold">Platform</span>
        <p-iftalabel>
            <input pInputText id="platform" [value]="this.account()?.platform?.name" autocomplete="off" disabled
                class="w-full mb-1" />
            <label for="platform">Platform</label>
        </p-iftalabel>
        <div class="card gap-2 w-full flex flex-row items-center justify-between">
            <p-iftalabel class="w-11/12 self-start">
                <input pInputText id="platformLink" [value]="this.account()?.platform?.link" autocomplete="off" disabled
                    class="w-full mb-1" />
                <label for="platformLink">Link</label>
            </p-iftalabel>
            <p-button size="large" variant="outlined"><i class="pi pi-clone" pButtonIcon></i></p-button>
        </div>
    </div>
    <div class="card gap-3 mx-10 my-3">
        <span class="block mb-1 font-semibold">Payment</span>
        <div class="card gap-2 w-full flex flex-row items-center justify-between">
            <p-iftalabel class="w-11/12 self-start">
                <input pInputText id="payment" [value]="this.account()?.payment?.card! | paymentHideDetailsPipe" autocomplete="off" disabled
                    class="w-full mb-1" />
                <label for="payment">Payment</label>
            </p-iftalabel>
            <p-button size="large" variant="outlined"><i class="pi pi-clone" pButtonIcon></i></p-button>
        </div>
        <p-iftalabel>
            <input pInputText id="bankName" [value]="this.account()?.payment?.bankName" autocomplete="off" disabled
                class="w-full mb-1" />
            <label for="bankName">Bank Name</label>
        </p-iftalabel>
    </div>
    }@else {
    <span>Platform</span>
    <div class="card gap-3 mx-10 my-3">
        <p-floatlabel variant="on" class="w-full">
            <p-select [formField]="$any(editForm.platform)" [options]="this.platforms()" optionValue="id"
                inputId="platform" optionLabel="name" [filter]="true" filterBy="name" [showClear]="true" class="w-full"
                appendTo="body" (onFilter)="this.onPlatformFilter($event)">
                <ng-template #selectedItem let-selectedOption>
                    <div class="flex items-center gap-2">
                        <div>{{ selectedOption.name }}</div>
                    </div>
                </ng-template>
                <ng-template let-platform #item>
                    <div class="flex items-center gap-2">
                        <img [src]="platform.icon" style="width: 18px" />
                        <div>{{ platform.name }}</div>
                    </div>
                </ng-template>
            </p-select>
            <label for="platform">Platform</label>
        </p-floatlabel>
    </div>
    <span>Payment</span>
    <div class="card gap-3 mx-10 my-3">
        <p-floatlabel variant="on" class="w-full">
            <p-select [formField]="$any(editForm.payment)" [options]="this.payments()" optionValue="id"
                optionLabel="card" [filter]="true" filterBy="card" [showClear]="true" inputId="payment" class="w-full"
                appendTo="body" (onFilter)="this.onPaymentFilter($event)">
                <ng-template #selectedItem let-selectedOption>
                    <div class="flex items-center gap-2">
                        <div>{{ selectedOption.card | paymentHideDetailsPipe}}</div>
                    </div>
                </ng-template>
                <ng-template let-payment #item>
                    <div class="flex items-center gap-2">
                        <div>{{ payment.card | paymentHideDetailsPipe}}</div>
                    </div>
                </ng-template>
            </p-select>
            <label for="payment">Payment</label>
        </p-floatlabel>
    </div>

    <div class="card gap-3 mx-10 my-3 flex justify-end">
        <p-button label="Save" (onClick)="this.onClickSaveButton()" [disabled]="!this.saveEditBtnDisabled()" />
    </div>
    }

</p-dialog>
