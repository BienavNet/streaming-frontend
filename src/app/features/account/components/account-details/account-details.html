<div class="card">
    <p-dialog header="Account Details" [draggable]="false" [modal]="true" [visible]="true" styleClass="w-xl"
        [closable]="true" [blockScroll]="true" [autofocus]="true" [contentStyle]="{'overflow': 'visible'}" (onHide)="this.onCloseModal.emit()">

        @if (this.isLoading()) {
        <p><i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i> Cargando datos...</p>
        }
        @else if (this.errorMessage()) {
        <p>{{ this.errorMessage() }}</p>
        }
        @else {
        <span>Details</span>
        <div class="card mx-10 my-3">
            <div class="card gap-2 w-full flex flex-row items-center justify-between">
                <p-iftalabel class="w-11/12 self-start">
                    <input pInputText id="email" [value]="this.account()?.email" autocomplete="off" disabled
                        class="w-full mb-1" />
                    <label for="email">Email</label>
                </p-iftalabel>
                <p-button size="large" variant="outlined"><i class="pi pi-clone" pButtonIcon (click)="this.copyText(this.account()?.email)"></i></p-button>
            </div>
            <div class="card gap-2 w-full flex flex-row items-center justify-between">
                <p-iftalabel class="w-11/12 self-start">
                    <input pInputText id="password" [value]="this.account()?.password" autocomplete="off" disabled
                        class="w-full mb-1" />
                    <label for="password">Password</label>
                </p-iftalabel>
                <p-button size="large" variant="outlined"><i class="pi pi-clone" pButtonIcon (click)="this.copyText(this.account()?.password)"></i></p-button>
            </div>
            <p-iftalabel>
                <input pInputText id="membershipBuyDate" [value]="this.account()?.membershipBuyDate" autocomplete="off"
                    disabled class="w-full mb-1" />
                <label for="membershipBuyDate">Membership Buy Date</label>
            </p-iftalabel>
            <p-iftalabel>
                <input pInputText id="membershipExpireDate" [value]="this.account()?.membershipExpireDate"
                    autocomplete="off" disabled class="w-full mb-1" />
                <label for="membershipExpireDate">Membership Expire Date</label>
            </p-iftalabel>
            <p-iftalabel>
                <input pInputText id="freeTrial" [value]="this.account()?.freeTrial" autocomplete="off" disabled
                    class="w-full mb-1" />
                <label for="freeTrial">Free Trial</label>
            </p-iftalabel>
            <p-iftalabel>
                <input pInputText id="registeredAt" [value]="this.account()?.registeredAt" autocomplete="off" disabled
                    class="w-full mb-1" />
                <label for="registeredAt">Registered At</label>
            </p-iftalabel>

        </div>

        <!-- Mejorar la UI de las entidades-->
        <span>Platform</span>
        <div class="card gap-3 mx-10 my-3">
            <p-iftalabel>
                <input pInputText id="platform" [value]="this.account()?.platform?.name" autocomplete="off" disabled
                    class="w-full mb-1" />
                <label for="platform">Platform</label>
            </p-iftalabel>
            <div class="card gap-2 w-full flex flex-row items-center justify-between">
                <p-iftalabel class="w-11/12 self-start">
                    <input pInputText id="platformLink" [value]="this.account()?.platform?.link" autocomplete="off" disabled
                        class="w-full mb-1" />
                    <label for="platformLink">Link</label>
                </p-iftalabel>
                <p-button size="large" variant="outlined"><i class="pi pi-clone" pButtonIcon></i></p-button>
            </div>
        </div>
        <span>Payment</span>
        <div class="card gap-3 mx-10 my-3">
            <div class="card gap-2 w-full flex flex-row items-center justify-between">
                <p-iftalabel class="w-11/12 self-start">
                    <input pInputText id="payment" [value]="this.account()?.payment?.card" autocomplete="off" disabled
                        class="w-full mb-1" />
                    <label for="payment">Payment</label>
                </p-iftalabel>
                <p-button size="large" variant="outlined"><i class="pi pi-clone" pButtonIcon></i></p-button>
            </div>
            <p-iftalabel>
                <input pInputText id="bankName" [value]="this.account()?.payment?.bankName" autocomplete="off" disabled
                    class="w-full mb-1" />
                <label for="bankName">Bank Name</label>
            </p-iftalabel>
        </div>

        }
    </p-dialog>
</div>
