<form>
    <div class="card">
        <!-- <p-panel header="Register Platform Form" class="w-xl h-3/5 flex p-8 text-xl"> -->
        <p-dialog header="Add new account" [draggable]="false" [modal]="true" [visible]="true" styleClass="w-xl min-w-0"
            [closable]="true" [blockScroll]="true" [autofocus]="true" [contentStyle]="{'overflow': 'visible'}" (onHide)="this.onCloseModal.emit()" closeOnEscape="true">
            <ng-template #header>
                <div class="w-full flex flex-col justify-start items-start">
                    <div class="flex flex-row justify-center items-center gap-10">
                        <span class="font-bold text-2xl">Register Account Form</span>
                    </div>
                    <div>
                        <span class="text-sm italic">You can register new accounts.</span>
                    </div>
                </div>
            </ng-template>
            <div class="gap-2 flex items-center flex-col">
                <p-floatlabel variant="on" class="w-full">
                    <input pInputText id="email" [formField]="this.registerForm.email" autocomplete="off"
                        class="w-full" />
                    <label for="email">Email</label>
                </p-floatlabel>
                <p-floatlabel variant="on" class="w-full">
                    <input pInputText id="password" [formField]="this.registerForm.password" autocomplete="off"
                        class="w-full" />
                    <label for="password">Password</label>
                </p-floatlabel>

                <div class="card w-full flex justify-center items-center flex-row gap-2">
                    <div class="w-full min-w-0  flex flex-col justify-center items-start mt-6 gap-0.5">
                        <p-floatlabel variant="on" class="w-full">
                            <p-select [formField]="$any(this.registerForm.payment)"
                                (onFilter)="this.onPaymentFilter($event)" [options]="this.payments()" optionValue="id"
                                optionLabel="card" [filter]="true" filterBy="card" [showClear]="true" inputId="payment"
                                class="w-full" appendTo="body">
                                <ng-template #selectedItem let-selectedOption>
                                    <div class="flex items-center gap-2">
                                        <div>{{ selectedOption.card }}</div>
                                    </div>
                                </ng-template>
                                <ng-template let-payment #item>
                                    <div class="flex items-center gap-2">
                                        <div>{{ payment.card }}</div>
                                    </div>
                                </ng-template>
                            </p-select>
                            <label for="payment">Payment</label>
                        </p-floatlabel>
                        <div>
                            <p-checkbox [value]="this.addNewPaymentIsClicked()" [binary]="true"
                                (onChange)="onChangePaymentSelect()" inputId="addPayment"
                                [disabled]="this.registerForm.payment().controlValue() ? true:false" />
                            <label for="addPayment" class="ml-2">Add new payment</label>
                        </div>
                    </div>
                    <p-floatlabel variant="on" class="w-full min-w-0">
                        <p-select [formField]="$any(this.registerForm.platform)"
                            (onFilter)="this.onPlatformFilter($event)" [options]="this.platforms()" optionValue="id"
                            inputId="platform" optionLabel="name" [filter]="true" filterBy="name" [showClear]="true"
                            class="w-full" appendTo="body">
                            <ng-template #selectedItem let-selectedOption>
                                <div class="flex items-center gap-2">
                                    <div>{{ selectedOption.name }}</div>
                                </div>
                            </ng-template>
                            <ng-template let-platform #item>
                                <div class="flex items-center gap-2">
                                    <img [src]="platform.icon" style="width: 18px" />
                                    <div>{{ platform.name }}</div>
                                </div>
                            </ng-template>
                        </p-select>
                        <label for="platform">Platform</label>
                    </p-floatlabel>

                </div>
                @if (this.addNewPaymentIsClicked()) {
                <span class="form-title-separator">Add Payment</span>
                <div class="card w-full flex justify-around items-center flex-row gap-2">
                    <p-floatlabel variant="on" class="w-full">
                        <input pInputText id="number" autocomplete="off" class="w-full"
                            [formField]="this.paymentRegisterForm.number" />
                        <label for="number">Card Number</label>
                    </p-floatlabel>
                    <div class="card w-full flex justify-around items-center flex-row gap-2">
                        <p-floatlabel variant="on" class="w-full">
                            <p-datepicker id="month" view="month" dateFormat="mm"
                                [formField]="$any(this.paymentRegisterForm.month)" dataType="string" />
                            <label for="month">Month</label>
                        </p-floatlabel>
                        <p-floatlabel variant="on" class="w-full">
                            <p-datepicker id="year" view="year" dateFormat="yy"
                                [formField]="$any(this.paymentRegisterForm.year)" dataType="string" />
                            <label for="year">Year</label>
                        </p-floatlabel>
                        <p-floatlabel variant="on" class="w-full">
                            <input pInputText id="cvv" autocomplete="off" class="w-full"
                                [formField]="this.paymentRegisterForm.cvv" />
                            <label for="cvv">CVV</label>
                        </p-floatlabel>
                    </div>
                </div>
                <div class="card w-full flex justify-around items-center flex-row gap-2">
                    <p-floatlabel variant="on" class="w-full">
                        <input pInputText id="password" autocomplete="off" class="w-full"
                            [formField]="this.paymentRegisterForm.bankName" />
                        <label for="password">Bank Name</label>
                    </p-floatlabel>
                </div>
                }
                
            </div>
            <div class="flex justify-end gap-2 mt-3">
                <p-button label="Save" (click)="this.saveAccountOnClick()" />
            </div>
        </p-dialog>
        <!-- </p-panel> -->
    </div>
</form>
