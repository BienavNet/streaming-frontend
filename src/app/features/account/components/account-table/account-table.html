<!-- <div class="w-full h-full card flex justify-center items-center"> -->
<p-confirmdialog />
<div class="h-full card grid grid-cols-1 grid-rows-1 p-3 lg:justify-items-center lg:items-center min-w-0">
    <p-panel class="sm:w-full sm:h-full lg:w-11/12 lg:h-11/12 p-8 text-xl overflow-scroll min-w-0">
        <ng-template #header>
            <div class="w-full flex flex-col justify-start items-start">
                <div class="flex flex-row justify-center items-center gap-10">
                    <span class="font-bold text-3xl">Accounts</span>
                    <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap"
                        label="Add Account" icon="pi pi-plus" severity="secondary"
                        (click)="this.onRegisterFormModalClick()" />
                </div>
                <div>
                    <span class="text-sm italic">You can manage here all about accounts.</span>
                </div>
            </div>
        </ng-template>
        <ng-template #content class="flex justify-end">
            <div class="w-full min-w-0 overflow-x-auto">
                <p-table [value]="page().content" [loading]="isLoading()" [scrollable]="true" [paginator]="true"
                    [rows]="page().currentSize" [totalRecords]="page().totalPages ? page().totalPages : 1"
                    sortField="email" (onPage)="onPaginationOccurs($event)" [rowsPerPageOptions]="[5, 10, 20]" showGridlines
                    stripedRows scrollHeight="400px" >
                    <ng-template #header>
                        <tr>
                            <th>ID</th>
                            <th>Email</th>
                            <th>Platform</th>
                            <th>Membership</th>
                            <th>Actions</th>
                        </tr>
                    </ng-template>
                    <ng-template #body let-account class="text-sm">
                        <tr>
                            <td class="w-1/12">{{account.id}}</td>
                            <td>{{account.email}}</td>
                            <td>{{account.platformName}}</td>
                            <td>
                                <p-button variant="text" severity="info" label="See Membership" [raised]="true"
                                    size="small" (click)="this.onMembershipModalClick(account.id)">
                                    <!-- <p-tag value="See Membership" severity="info" /> -->
                                </p-button>
                            </td>
                            <td>
                                <div class="card flex flex-row items-center justify-center gap-1">
                                    <p-button size="small"
                                        class="flex items-center justify-start gap-2 whitespace-nowrap" label="Info"
                                        icon="pi pi-id-card" severity="info"
                                        (click)="this.onClickAccountDetails(account.id)" />

                                    <p-button size="small"
                                        class="flex items-center justify-start gap-2 whitespace-nowrap" label="Delete"
                                        icon="pi pi-trash" severity="danger"
                                        (click)="this.onClickDeleteBtn($event, account.id)" />

                                </div>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </ng-template>

        @if (this.isRegisterFormModalOpen()) {
        <app-account-register-form (onCloseModal)="this.onRegisterFormModalClick()" />
        }

        @if (this.accountDetailsId()) {
        <app-account-details (onCloseModal)="this.onCloseAccountDetailsModal()" [accountId]="accountDetailsId()!" />
        }

        @if (this.membershipIdToQuery()) {
        <app-membership (onCloseModal)="this.onMembershipModalClick(undefined)"
            [accountId]="this.membershipIdToQuery()!" />
        }


    </p-panel>
</div>
