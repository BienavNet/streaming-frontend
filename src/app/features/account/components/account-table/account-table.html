<!-- <div class="w-full h-full card flex justify-center items-center"> -->
<p-confirmdialog />
<div class="h-full card grid grid-cols-1 grid-rows-1 p-3 justify-items-center items-center">
    <p-panel class="w-11/12 h-11/12 p-8 text-xl">
        <ng-template #header>
            <div class="w-full flex justify-start items-center gap-10 p">
                <div>
                    <span class="font-bold text-3xl">Accounts</span>
                </div>
                <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap"
                    label="Add Account" icon="pi pi-plus" severity="secondary"
                    (click)="this.onRegisterFormModalClick()" />
            </div>
        </ng-template>
        <p-table [value]="page().content" [loading]="isLoading()" [scrollable]="true" [paginator]="true"
            [rows]="page().currentSize" [totalRecords]="page().totalPages ? page().totalPages : 1" sortField="email"
            (onPage)="onPaginationOccurs($event)" [rowsPerPageOptions]="[5, 10, 20]">
            <ng-template #header>
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Platform</th>
                    <th>Membership</th>
                    <th>Actions</th>
                </tr>
            </ng-template>
            <ng-template #body let-account class="text-sm">
                <tr>
                    <td class="w-1/12">{{account.id}}</td>
                    <td>{{account.email}}</td>
                    <td>{{account.platformName}}</td>
                    <td>
                        <p-button variant="text" severity="info" label="See Membership" [raised]="true" size="small"
                            (click)="this.onMembershipModalClick(account.id)">
                            <!-- <p-tag value="See Membership" severity="info" /> -->
                        </p-button>
                    </td>
                    <td>
                        <div class="card flex flex-row items-center justify-center gap-1">
                            <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap"
                                label="Info" icon="pi pi-id-card" severity="info"
                                (click)="this.onClickAccountDetails(account.id)" />

                            <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap"
                                label="Delete" icon="pi pi-trash" severity="danger"
                                (click)="this.onClickDeleteBtn($event, account.id)" />

                        </div>
                    </td>
                </tr>


            </ng-template>
        </p-table>

        @if (this.isRegisterFormModalOpen()) {
        <app-account-register-form (onCloseModal)="this.onRegisterFormModalClick()" />
        }

        @if (this.accountDetailsId()) {
        <app-account-details (onCloseModal)="this.onCloseAccountDetailsModal()" [accountId]="accountDetailsId()!" />
        }

        @if (this.membershipIdToQuery()) {
        <app-membership (onCloseModal)="this.onMembershipModalClick(undefined)"
            [accountId]="this.membershipIdToQuery()!" />
        }


    </p-panel>
</div>
