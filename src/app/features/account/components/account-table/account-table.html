<div class="w-full h-full card flex justify-center items-center">
    <p-confirmdialog />
    <p-panel class="w-5/6 h-11/12 flex p-8 text-xl">
        <ng-template #header>
            <div class="w-full flex justify-between items-center px-4">
                <div>
                    <span class="font-bold text-3xl">Accounts</span>
                </div>
                <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap" label="Add Account"
                    icon="pi pi-plus" severity="secondary" (click)="this.onRegisterFormModalClick()" />
            </div>
        </ng-template>
        <p-table 
            [value]="page().content" 
            class="w-full" 
            [loading]="isLoading()" 
            [scrollable]="true"
            [paginator]="true"
            [rows]="page().totalPages"
            [rowsPerPageOptions]="[10]"
            sortField="email"
            (onPage)="onPaginationOccurs($event)"
            >
            <ng-template #header>
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Platform</th>
                    <th>Membership</th>
                    <th>Actions</th>
                </tr>
            </ng-template>
            <ng-template #body let-account class="text-sm">
                <tr>
                    <td class="w-1/12">{{account.id}}</td>
                    <td>{{account.email}}</td>
                    <td>{{account.platformName}}</td>
                    <td>
                        <p-button variant="text" severity="info" label="See Membership" [raised]="true" size="small" (click)="this.onMembershipModalClick(account.id)">
                            <!-- <p-tag value="See Membership" severity="info" /> -->
                        </p-button>
                    </td>
                    <td>
                        <div class="card flex flex-row items-center justify-center gap-1">
                            <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap"
                                label="Info" icon="pi pi-id-card" severity="info"
                                (click)="this.onClickAccountDetails(account.id)" />

                            <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap"
                                label="Delete" icon="pi pi-trash" severity="danger" (click)="this.onClickDeleteBtn($event, account.id)" />

                        </div>
                    </td>
                </tr>


            </ng-template>
        </p-table>

        @if (this.isRegisterFormModalOpen()) {
        <app-account-register-form (onCloseModal)="this.onRegisterFormModalClick()" />
        }

        @if (this.accountDetailsId()) {
            <app-account-details (onCloseModal)="this.onCloseAccountDetailsModal()" [accountId]="accountDetailsId()!" />
        }

        @if (this.membershipIdToQuery()) {
            <app-membership (onCloseModal)="this.onMembershipModalClick(undefined)" [membershipId]="this.membershipIdToQuery()!" />
        }


    </p-panel>
</div>
