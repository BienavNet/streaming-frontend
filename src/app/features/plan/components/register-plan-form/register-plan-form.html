<form>
    <div class="card">
        <div class="gap-3 flex items-center flex-col mt-2">
            <p-floatlabel variant="on" class="w-full">
                <!-- <input pInputText id="password" [formField]="this.registerForm.password" autocomplete="off"
                    class="w-full" /> -->
                <input pInputText id="platform" autocomplete="off" class="w-full" [formField]="this.registerForm.platform" />
                <label for="platform">Platform</label>
            </p-floatlabel>
            <p-floatlabel variant="on" class="w-full">
                <input pInputText id="planName" autocomplete="off" class="w-full" [formField]="this.registerForm.plan" />
                <label for="planName">Plan Name</label>
            </p-floatlabel>
            <p-floatlabel variant="on" class="w-full">
                <input pInputText id="profiles" autocomplete="off" class="w-full" type="number" [formField]="this.registerForm.profiles" />
                <label for="profiles">Profiles Quantity</label>
            </p-floatlabel>
        </div>
        <div class="flex justify-end gap-2 mt-3">
            <p-button label="Save" (onClick)="this.onClickSavePlan()" />
        </div>
    </div>
</form>
