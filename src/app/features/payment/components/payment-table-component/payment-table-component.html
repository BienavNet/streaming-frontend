<p-confirmdialog />
<div class="h-full card grid grid-cols-1 grid-rows-1 p-3 lg:justify-items-center lg:items-center min-w-0">
    <p-panel class="sm:w-full sm:h-full lg:w-11/12 lg:h-11/12 p-8 text-xl overflow-scroll min-w-0">
        <ng-template #header>
            <div class="w-full flex flex-col justify-start items-start">
                <div class="flex flex-row justify-center items-center gap-10">
                    <span class="font-bold text-3xl">Payments</span>
                    <!-- <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap" label="Add Order"
                    icon="pi pi-plus" severity="secondary" /> -->
                </div>
                <div>
                    <span class="text-sm italic">You can look all details about payments.</span>
                </div>

            </div>
        </ng-template>
        <p-table [value]="this.page().content" class="w-full min-w-0" [loading]="this.isLoading()" [scrollable]="true"
            [paginator]="true" [rows]="this.page().currentSize" sortField="email"
            (onPage)="this.onPaginationOccurs($event)" [rowsPerPageOptions]="[5, 10, 20]" showGridlines stripedRows
            scrollHeight="400px">
            <ng-template #header>
                <tr>
                    <th>ID</th>
                    <th>Card</th>
                    <th>Bank</th>
                    <th>Actions</th>
                </tr>
            </ng-template>
            <ng-template #body let-payment class="text-sm">
                <tr>
                    <td class="w-1/12">{{payment.id}}</td>
                    <td>{{this.revealedCards().has(payment.id) ? payment.card : payment.card | paymentHideDetailsPipe }}</td>
                    <td>{{payment.bankName}}</td>
                    <td>
                        <div class="card flex flex-row items-center justify-center gap-1">
                            <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap "
                                [label]="this.revealedCards().has(payment.id) ? 'Hide' : 'Show'" icon="pi pi-id-trash" severity="secondary"
                                (click)="this.onClickShowInfo(payment.id)" />
                            <p-button size="small" class="flex items-center justify-start gap-2 whitespace-nowrap"
                                label="Delete" icon="pi pi-id-trash" severity="danger"
                                (click)="this.onClickDeleteBtn($event, payment.id)" />
                        </div>
                    </td>
                </tr>


            </ng-template>
        </p-table>
    </p-panel>

</div>
